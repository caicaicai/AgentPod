# AgentPod 标准部署编排（集群模式）
#
# 默认配置面向本地开发（NODE_ENV=development, LLM_MODE=faux, AUTH_MODE=dev）。
# 生产部署时通过 .env 或环境变量覆盖，例如：
#   NODE_ENV=production AUTH_MODE=password LLM_MODE=db docker compose up -d
#
# ⚠️ LLM_MODE=direct 在 NODE_ENV=production 下会被**拒绝启动**（一把共用的静态 key，
# 用户之间的计费与审计边界会消失）。自己接模型网关用 LLM_MODE=db：
# 模型清单存数据库、管理台维护、按用户分组开放，用量仍按人记账。
#
# 启动全部服务：
#   docker compose up -d
#
# 查看日志：
#   docker compose logs -f agent
#   docker compose logs -f worker
#   docker compose logs -f manager

services:
  # ── Agent 主服务 ──────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentpod-agent
    restart: unless-stopped
    ports:
      # 唯一对外的服务。放在 nginx/CDN 后面时改成 AGENT_BIND=127.0.0.1，
      # 别让人绕过反代直连源站
      - "${AGENT_BIND:-0.0.0.0}:${PORT:-8787}:${PORT:-8787}"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-8787}
      - LLM_MODE=${LLM_MODE:-faux}
      # LLM_MODE=db 时模型 Key 的加密密钥。**必须显式透传** ——
      # 这个 environment 块会盖过 env_file，只写在 .env 里而这里不列的话，
      # 容器里读到的是空值：现象是管理台上一排「Key 解不开」的模型，
      # 而 .env 里那一行明明写着。留空 = 明文入库（启动日志会 warn 一次）。
      - LLM_CONFIG_SECRET=${LLM_CONFIG_SECRET:-}
      - AUTH_MODE=${AUTH_MODE:-dev}
      # 开发态默认开着（本地调试要用）。NODE_ENV=production 下它必须是 0，
      # 否则服务**拒绝启动** —— 所以生产部署要在 .env 里显式写 DEV_CONSOLE=0。
      # 写死成 1 的话，.env 里那一行会被这里盖掉，现象是"我明明关了却还是起不来"
      - DEV_CONSOLE=${DEV_CONSOLE:-1}
      # 集群模式：通过 manager 调度 worker
      - SANDBOX_MODE=manager
      - SANDBOX_MANAGER_URL=http://manager:3000
      - SANDBOX_MANAGER_CODE=${SANDBOX_MANAGER_CODE:-dev-api-code}
      # ── 结构化存储（MySQL，必需）──
      #
      # 会话、项目、长期记忆、作品、分享/市场、定时任务、账号全在库里。
      # 本服务不再有"文件模式"—— 理由见 src/persistence/storage.js 的文件头。
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-agentpod}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-agentpod}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agentpod}
    volumes:
      # 只剩会话工作区与用户技能要落盘（结构化数据全在 MySQL 里）。
      # 从前还有一个 agent-data 卷装 DATA_DIR，随文件模式一起去掉了。
      - workspace-data:/data/ap-workspace
    depends_on:
      manager:
        condition: service_started
      # 等健康检查过。没有它，agent 会在 MySQL 还在初始化数据目录时就去连，
      # 然后以"连不上数据库"退出 —— 而重启一次又好了，看起来像随机故障
      mysql:
        condition: service_healthy

  # ── Sandbox Worker ────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: sandbox-worker/Dockerfile
    container_name: agentpod-worker
    restart: unless-stopped
    privileged: true
    ports:
      # 集群内部接口，只被 agent/manager 调用 —— 默认不出本机。
      # 要跨机部署 worker 再显式改 WORKER_BIND=0.0.0.0
      - "${WORKER_BIND:-127.0.0.1}:${WORKER_PORT:-8080}:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - SANDBOX_SLOTS=${SANDBOX_SLOTS:-2}
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:-dev-shared-token}
      - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-0}
      - SANDBOX_WORK_ROOT=/var/tmp/ap-sandbox
      - BROWSER_ENABLED=${BROWSER_ENABLED:-1}
      - PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
      # 向 manager 注册并周期心跳
      - SANDBOX_MANAGER_URL=http://manager:3000
      - SANDBOX_MANAGER_CODE=${SANDBOX_MANAGER_CODE:-dev-api-code}
      - SANDBOX_TICKET_SECRET=${SANDBOX_TICKET_SECRET:-dev-ticket-secret}
      # worker 在集群内的可达地址（manager 调度后 agent 直连此地址）
      - SANDBOX_ADVERTISE_BASE=http://worker:8080
      # Docker Desktop 的内嵌 DNS 在 slot 的 netns 里不可达，需指定真实 DNS
      - SANDBOX_DNS_SERVERS=${SANDBOX_DNS_SERVERS:-8.8.8.8,1.1.1.1}
      # ── 每 slot 资源上限（cgroup v2）──
      # 不在这里列出来的话，.env 里写了也**没有任何效果**：这个 environment 块
      # 是白名单，容器里只看得到列出来的变量
      - SANDBOX_NS_CPU_MAX_CORES=${SANDBOX_NS_CPU_MAX_CORES:-1}
      - SANDBOX_NS_MEMORY_MAX_MB=${SANDBOX_NS_MEMORY_MAX_MB:-1024}
      - SANDBOX_NS_PIDS_MAX=${SANDBOX_NS_PIDS_MAX:-256}
      # 节点侧出站白名单。注意 manager 一旦下发策略就**整体覆盖**这两个值，
      # 不是合并 —— 集群模式下真正说了算的是 manager 那边的 SANDBOX_EGRESS_MODE
      - SANDBOX_EGRESS_MODE=${SANDBOX_EGRESS_MODE:-allowlist}
      - SANDBOX_EGRESS_ALLOW=${SANDBOX_EGRESS_ALLOW:-}
    volumes:
      - worker-data:/var/tmp/ap-sandbox
    depends_on:
      manager:
        condition: service_started

  # ── Sandbox Manager（集群管理台）──────────────────────────────────
  manager:
    build:
      context: ./sandbox-manager
      dockerfile: Dockerfile
    container_name: agentpod-manager
    restart: unless-stopped
    ports:
      # 调度接口 + 管理台，默认不出本机。要远程开管理台走 SSH 隧道，
      # 别直接改成 0.0.0.0 —— 它能改所有 slot 的出站策略
      - "${MANAGER_BIND:-127.0.0.1}:${MANAGER_PORT:-3000}:3000"
    env_file:
      - path: ./sandbox-manager/.env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      # 票据密钥（manager 签发、worker 校验，必须一致）
      - SANDBOX_TICKET_SECRET=${SANDBOX_TICKET_SECRET:-dev-ticket-secret}
      # API 鉴权码（worker 和 agent 用它访问 manager 的调度接口）
      - API_SECURITY_CODES=${SANDBOX_MANAGER_CODE:-dev-api-code}
      # 沙盒出站策略：open=自由访问，allowlist=白名单拦截。
      # 默认跟代码里的默认值一致（allowlist）—— 从前这里默认 open，而 manager
      # 下发的策略会整体覆盖节点侧配置，于是 worker 那边设了白名单也不算数
      - SANDBOX_EGRESS_MODE=${SANDBOX_EGRESS_MODE:-allowlist}
      # 管理台登录账号。**不要复用 CONSOLE_USERS** —— 那个是 agent 的管理员账号，
      # 两个服务读同一份 .env，同名的话设一个等于把两处密码设成同一个
      - CONSOLE_USERS=${MANAGER_CONSOLE_USERS:-admin:changeme}
    depends_on:
      redis:
        condition: service_started

  # ── Redis（Manager 状态存储）─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentpod-redis
    restart: unless-stopped
    ports:
      # 无密码 Redis。默认必须只监听回环 —— 公网上的空口令 Redis
      # 是分钟级就会被打穿的东西
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ── MySQL（必需）──────────────────────────────────────────────────
  #
  # 本服务的结构化数据只存数据库，所以它是编排的一部分，不是可选项。
  #
  # 表结构由 agent 启动时自动建（CREATE TABLE IF NOT EXISTS，可反复跑），
  # 不需要先手工导 schema。一份可审阅的真相在 src/persistence/schema.sql。
  mysql:
    image: mysql:8.0
    container_name: agentpod-mysql
    restart: unless-stopped
    ports:
      # 默认**只监听回环**：数据库不该因为跑了一条 compose 就暴露在局域网上。
      # 要从别的机器连，显式改成 MYSQL_BIND=0.0.0.0
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-agentpod-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agentpod}
      - MYSQL_USER=${MYSQL_USER:-agentpod}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-agentpod}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # agent 要等这个通过才启动。没有健康检查的话，agent 会在 MySQL
      # 还在初始化数据目录时就去连，然后以"连不上数据库"退出 ——
      # 而重启一次又好了，于是这个故障看起来像随机的
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-agentpod-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  workspace-data:
  worker-data:
  redis-data:
  mysql-data:
