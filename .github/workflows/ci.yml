# 提交与 PR 上跑的检查。
#
# ── 为什么这个文件值得存在 ──────────────────────────────────────────────
#
# 这个仓库有 1100 多条测试和一个专门的隔离契约校验脚本，在此之前**没有任何东西
# 自动跑它们** —— 全靠每个人记得在推之前敲一遍 `npm run check`。那种约定的失效
# 方式很安静：谁赶时间跳过一次，红的那条测试就一路躺到下一个人手里，
# 而那时已经分不清是谁改坏的了。
#
# ── 三个 job 而不是一个 ─────────────────────────────────────────────────
#
# 拆开是为了让失败**一眼能归因**：红的是 lint、是服务端测试、还是前端构建，
# 在列表上直接看得到，不用点进日志翻。三个可以并行，总时长取决于最慢的那个。
#
# ── @v5 和 node-version 是两回事，别混 ──────────────────────────────────
#
# actions/* 固定在 @v5，是因为 @v4 的 **action 自己**跑在 Node 20 运行时上，
# GitHub 正在下线它（2026-09-16 从 runner 上移除），于是每次跑都挂一条
# "Node.js 20 actions are deprecated"。@v5 换成了 Node 24 运行时。
#
# ⚠️ 那条告警说的**不是**下面的 `node-version: '20.19'`。前者是"跑 action 的
# 那个 node"，后者是"跑我们代码的那个 node"，两者互不相干 —— 把 node-version
# 改上去并不能让告警消失，只会悄悄把测试搬离 engines 声明的下限。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支上连着推几次时，把还在跑的旧任务取消掉 —— 没人关心倒数第二次提交
# 的测试结果，而它们在排队占位置。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: 服务端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # package.json 的 engines 写的是 >=20.11。**按下限跑** ——
          # 在最新版上跑只能证明"在最新版上能跑"，而部署环境未必是最新版。
          node-version: '20.19'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci

      # `node --test` 会把 test/ 下的用例全扫进来，其中九个 import 了 web/src 下的
      # 纯逻辑模块（route、format、highlight……）—— 前端那半边的行为也有人守着，
      # 而不用起一个浏览器。它们绝大多数不依赖任何包，唯独 lib/dialog.js 要
      # `reactive`（弹框状态得是响应式的，不然界面不跟着变），于是这一条把
      # **整个服务端测试**卡在 Cannot find package 'vue' 上。
      #
      # 装一遍前端依赖比拆用例便宜：拆的话得再维护一套"哪些前端模块可以被服务端
      # 测试碰"的规矩，而这条规矩没人看得见，下次照样踩。
      - run: npm ci --prefix web

      # 隔离契约的静态校验。它排在测试**之前**：这条一旦破了，
      # 下面那些用例即使全绿也说明不了什么（见 scripts/check-isolation-rules.js）。
      - name: 隔离契约自检
        run: npm run check:isolation

      # 测试全程不需要 MySQL —— 存储层在用例里由 test/helpers/memory-storage.js
      # 顶替。真要连库的那部分属于集成测试，不在这条流水线上。
      - name: 单元测试
        run: npm test

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 前端的 engines 要求比服务端高（Vite 7 的下限）
          node-version: '20.19'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web

      # 构建本身就是检查：Vue 单文件组件里的语法错、import 不到的模块，
      # 都要到这一步才现形 —— 服务端那套测试一个都发现不了。
      - run: npm run build --prefix web
